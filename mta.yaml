_schema-version: 3.3.0
ID: student_app
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npx rimraf gen/db/src/gen/data
modules:
  - name: student_app-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: student_app-auth
      - name: student_app-db
      - name: student_app-destination

  - name: student_app-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: student_app-db

  - name: student_app-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: student_appcustomer_order_details
          artifacts:
            - customer_order_details.zip
          target-path: app/
    requires:
      - name: student_app-auth
      - name: srv-api
      - name: student_app-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: student_appcustomer_order_details
    type: html5
    path: app/customer_order_details
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: student_app-destinations
    type: com.sap.application.content
    requires:
      - name: student_app-auth
        parameters:
          service-key:
            name: student_app-auth-key
      - name: student_app-html5-repo-host
        parameters:
          service-key:
            name: student_app-html5-repo-host-key
      - name: srv-api
      - name: student_app-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: student_app-html5-repository
              ServiceInstanceName: student_app-html5-repo-host
              ServiceKeyName: student_app-html5-repo-host-key
              sap.cloud.service: student_app.service
            - Name: student_app-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: student_app-auth
              ServiceKeyName: student_app-auth-key
              sap.cloud.service: student_app.service

resources:
  - name: student_app-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: student_app-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: student_app-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: student_app-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: student_app-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
